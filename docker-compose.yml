version: '3.8'

services:
  app:
    # Pull pre-built image from Docker Hub instead of building locally
    # Replace <your-dockerhub-username> with your actual Docker Hub username
    image: dangnam141002/z-ancestor:latest
    pull_policy: always  # Always pull latest image
    ports:
      - "8080:8080"
    volumes:
      # Named volume - Docker quản lý, data persist khi rebuild
      - db-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/production.db
      - ADMIN_PIN=${ADMIN_PIN:-123456}
      - HOSTNAME=0.0.0.0
    restart: unless-stopped

volumes:
  # Named volume cho database
  db-data:
    driver: local
